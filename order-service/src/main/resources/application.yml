# Centralized Configuration - unified config
server:
  port: 8080
  
# // Event Streaming - continuous data flow

spring:
  profiles:
    active: dev
  kafka:
    bootstrap-servers: <YOUR_REDPANDA_BOOTSTRAP_URL>:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="<REDPANDA_USER>" password="<REDPANDA_PASSWORD>";

# Actuator and Micrometer - App health and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
			  
# // Actuator and Micrometer - app metrics
  metrics:
    export:
      prometheus:
        enabled: true