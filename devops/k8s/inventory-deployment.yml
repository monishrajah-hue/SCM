apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: yourdockerhubuser/scm-inventory-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service-svc
spec:
  # // Services (ClusterIP) - internal cluster networking pods
  type: ClusterIP 
  selector:
    app: inventory-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081