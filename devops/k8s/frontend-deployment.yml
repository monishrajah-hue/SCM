apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scm-frontend
  template:
    metadata:
      labels:
        app: scm-frontend
    spec:
      containers:
      - name: scm-frontend
        image: yourdockerhubuser/scm-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: scm-frontend-svc
spec:
  # // Services (NodePort) - exposing pods externally
  type: NodePort
  selector:
    app: scm-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080