apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      # // K8s Architecture - orchestration; Master and Worker Nodes - cluster control; Pods - smallest deployable unit; Deployments - scaling pods; Services - networking pods
      containers:
      - name: order-service
        image: yourdockerhubuser/scm-order-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-svc
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080